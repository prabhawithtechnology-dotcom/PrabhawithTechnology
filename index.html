<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin | Prabhawith Technology</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="wrap" style="padding:20px 18px"><h2>Admin Dashboard</h2>
<form id="login"><input id="em" type="email" placeholder="Admin email" required autocomplete="username"><input id="pw" type="password" placeholder="Password" required autocomplete="current-password"><button class="btn">Login</button><div class="msg" id="lm"></div></form>
<div id="app" hidden><p><button class="btn s" id="out">Logout</button> <button class="btn s" id="csv">Export Enquiries (CSV)</button></p>
<div class="grid" id="stats"></div>
<h3>Enquiries</h3><div id="enqs"></div>
<h3>Feedback</h3><div id="fbs"></div>
<h3>Portfolio Projects</h3>
<form id="pf"><input name="name" placeholder="Project name" required maxlength="120"><select name="category"><option>Websites</option><option>Graphics</option><option>AI Solutions</option><option>Marketing</option><option>Video Production</option></select>
<textarea name="description" placeholder="Description" maxlength="1000"></textarea><input name="image" placeholder="Image URL (https://…)"><input name="tech" placeholder="Technologies used"><input name="url" placeholder="Live website URL (https://…)"><input name="date" type="date"><button class="btn">Add Project</button></form><div id="pjs" class="grid" style="margin-top:16px"></div></div></div>
<script type="module">
import {CONFIG} from '../js/config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,collection,getDocs,getDoc,doc,updateDoc,deleteDoc,addDoc,query,orderBy,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const app=initializeApp(CONFIG.firebase),auth=getAuth(app),db=getFirestore(app),$=s=>document.querySelector(s);
const mk=(t,x,c)=>{const e=document.createElement(t);if(x!==undefined)e.textContent=x;if(c)e.className=c;return e};
const ST=['New','Contacted','Discussion','Quotation Sent','Project Confirmed','Completed','Closed'];let rows=[];
$('#login').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('#em').value,$('#pw').value)}catch{$('#lm').textContent='Login failed';$('#lm').className='msg err on'}};
$('#out').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
 if(!u){$('#login').hidden=false;$('#app').hidden=true;return}
 try{const a=await getDoc(doc(db,'admins',u.uid));if(!a.exists())throw 0}catch{await signOut(auth);$('#lm').textContent='This account is not authorised as admin.';$('#lm').className='msg err on';return}
 $('#login').hidden=true;$('#app').hidden=false;load()});
async function load(){await Promise.all([enq(),fb(),pj()])}
async function enq(){const s=await getDocs(query(collection(db,'enquiries'),orderBy('createdAt','desc')));rows=s.docs.map(d=>({id:d.id,...d.data()}));
 const n=x=>rows.filter(r=>x.includes(r.status)).length;$('#stats').textContent='';
 [['Total',rows.length],['New',n(['New'])],['Active',n(['Contacted','Discussion','Quotation Sent','Project Confirmed'])],['Completed',n(['Completed'])]].forEach(([l,v])=>{const c=mk('div','','card');c.append(mk('div',v,'stat'),mk('div',l));$('#stats').append(c)});
 const b=$('#enqs');b.textContent='';rows.forEach(r=>{const c=mk('div','','card');c.style.marginBottom='12px';
  c.append(mk('b',`${r.name} · ${r.service}`),mk('p',`${r.email} · ${r.mobile}${r.business?' · '+r.business:''}`),mk('p',r.message),mk('p',`Budget: ${r.budget||'-'} · Due: ${r.date||'-'}${r.extra?' · '+r.extra:''}`));
  const sel=mk('select');ST.forEach(x=>{const o=mk('option',x);if(x===r.status)o.selected=true;sel.append(o)});
  sel.onchange=()=>updateDoc(doc(db,'enquiries',r.id),{status:sel.value}).then(enq);c.append(sel);b.append(c)})}
async function fb(){const s=await getDocs(collection(db,'feedback'));const b=$('#fbs');b.textContent='';
 s.forEach(d=>{const x=d.data(),c=mk('div','','card');c.style.marginBottom='12px';c.append(mk('b',`${x.name} · ${'★'.repeat(x.rating||0)}`),mk('p',x.text),mk('p',x.approved?'Published':'Pending'));
  const a=mk('button',x.approved?'Unpublish':'Approve','btn s');a.onclick=()=>updateDoc(doc(db,'feedback',d.id),{approved:!x.approved}).then(fb);
  const r=mk('button','Delete','btn s');r.onclick=()=>confirm('Delete?')&&deleteDoc(doc(db,'feedback',d.id)).then(fb);c.append(a,' ',r);b.append(c)})}
async function pj(){const s=await getDocs(collection(db,'projects'));const b=$('#pjs');b.textContent='';
 s.forEach(d=>{const x=d.data(),c=mk('div','','card');c.append(mk('b',x.name),mk('p',x.category));const r=mk('button','Delete','btn s');r.onclick=()=>confirm('Delete?')&&deleteDoc(doc(db,'projects',d.id)).then(pj);c.append(r);b.append(c)})}
$('#pf').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));await addDoc(collection(db,'projects'),{...d,createdAt:serverTimestamp()});e.target.reset();pj()};
$('#csv').onclick=()=>{const k=['createdAt','name','email','mobile','business','service','message','budget','date','extra','status'];
 const q=v=>{v=String(v&&v.toDate?v.toDate().toISOString():v??'');if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
 const t=[k.join(','),...rows.map(r=>k.map(x=>q(r[x])).join(','))].join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='enquiries.csv';a.click()};
</script></body></html>
